<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INOZE Admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<div id="login" class="center"><form id="loginForm" class="card"><b>INOZE ADMIN</b><span>ĐĂNG NHẬP</span><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Mật khẩu" required><button>ĐĂNG NHẬP</button><small id="loginError"></small></form></div>
<div id="app" class="hidden"><aside><h2>INOZE</h2><small>ADMIN</small><button data-page="dash">Tổng quan</button><button data-page="beats">♪ Beats</button><button data-page="orders">🛒 Đơn hàng</button><button data-page="messages">✉ Yêu cầu</button><button id="logout">↪ Đăng xuất</button></aside>
<main><header><div><small>INOZE / ADMIN</small><h1 id="title">Tổng quan</h1></div><button id="newBeat">+ Thêm beat</button></header>
<section id="dash" class="page"><div class="stats"><div><small>BEATS</small><b id="sBeats">0</b></div><div><small>ĐƠN HÀNG</small><b id="sOrders">0</b></div><div><small>YÊU CẦU</small><b id="sMessages">0</b></div><div><small>ACTIVE</small><b id="sActive">0</b></div></div><div class="card"><h3>Beat mới nhất</h3><div id="recent"></div></div></section>
<section id="beats" class="page hidden"><div class="card"><div class="row"><h3>Quản lý Beats</h3><button id="newBeat2">+ Thêm beat</button></div><input id="search" placeholder="Tìm beat..."><div id="beatTable"></div></div></section>
<section id="orders" class="page hidden"><div class="card"><h3>Đơn hàng</h3><div id="orderTable"></div></div></section>
<section id="messages" class="page hidden"><div class="card"><h3>Yêu cầu liên hệ</h3><div id="messageTable"></div></div></section>
</main></div>

<div id="modal" class="overlay hidden"><form id="beatForm" class="modal"><div class="row"><h2 id="mTitle">Thêm beat</h2><button type="button" id="close">×</button></div><input id="id" type="hidden"><div class="grid"><label>Tên<input id="fTitle" required></label><label>Artist<input id="fArtist" value="INOZE" required></label><label>BPM<input id="fBpm" type="number" ></label><label>Key<input id="fKey" ></label><label>Genre<input id="fGenre"></label><label>Giá<input id="fPrice" type="number" ></label><label>Cover URL<input id="fCover"></label><label>
  File MP3
  <input id="fAudioFile" type="file" accept=".mp3,audio/mpeg">
  <small id="audioName" class="muted">Chưa chọn file</small>
</label></div><label>
  Ảnh cover / Avatar
  <input
    id="fCoverFile"
    type="file"
    accept="image/png,image/jpeg,image/webp"
  >
  <small id="coverName" class="muted">Chưa chọn ảnh</small>
</label>

<img
  id="coverPreview"
  style="display:none;width:80px;height:80px;object-fit:cover;border-radius:10px;margin-top:8px;"
><label>Mô tả<textarea id="fDesc"></textarea></label><div class="row"><button type="button" id="cancel">Hủy</button><button type="submit" id="saveBeat">Lưu</button></div></form></div>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
